# Deploys main to https://call.budddy.app: builds web/, rsyncs it with deploy/ to
# buddy-root, rebuilds the callguard container there, and fails if the site doesn't answer.
# One-time setup of the VPS is deploy/setup-vps.sh.
name: deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://call.budddy.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Same Node as deploy/Dockerfile
          node-version: 24.22.1
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build web/
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          dir="$RUNNER_TEMP/ssh"
          install -m 700 -d "$dir"
          install -m 600 /dev/null "$dir/id_ed25519"
          printf '%s\n' "$SSH_KEY" > "$dir/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$dir/known_hosts"
          printf '%s\n' 'Host *' "  IdentityFile $dir/id_ed25519" "  UserKnownHostsFile $dir/known_hosts" \
            '  IdentitiesOnly yes' > "$dir/config"
          echo "SSH_CONFIG=$dir/config" >> "$GITHUB_ENV"
      - name: Deploy
        env:
          TARGET: callguard@${{ vars.DEPLOY_SSH_HOST }}
        # The key's forced command (deploy/callguard-ssh) allows only these two
        run: |
          cp -r web/.output deploy/
          rsync -a --delete -e "ssh -F $SSH_CONFIG" --exclude macmini --exclude setup-vps.sh \
            --exclude callguard-ssh deploy/ "$TARGET:"
          ssh -F "$SSH_CONFIG" "$TARGET" restart
      - name: Check the site answers
        run: curl -fsS --retry 10 --retry-delay 3 --retry-all-errors -o /dev/null https://call.budddy.app/
      - name: Remove the SSH key
        if: always()
        run: rm -rf "$RUNNER_TEMP/ssh"
